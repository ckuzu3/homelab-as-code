# Ansible reads this file only when it is not world-writable, which is worth knowing if
# you ever run this from a Windows drive mounted into WSL without the metadata option.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
# The prettier `yaml` callback lives in community.general since ansible-core 2.19, and
# one collection for nicer output is not a trade worth making. The default callback
# prints the recap this project actually reads: changed=0 on the second run.
display_skipped_hosts = false
host_key_checking = true
interpreter_python = auto_silent
forks = 10

[ssh_connection]
pipelining = true
