---
# One group, because a homelab is one machine until it is not. Adding a second host means
# adding a line here, not changing a role.
all:
  children:
    homelab:
      hosts:
        homelab-local:
          ansible_connection: local
          ansible_host: 127.0.0.1

# A real box over SSH would be another entry under hosts:, like this. Nothing in the
# roles cares which kind it is, which is the point of writing them against facts rather
# than against localhost.
#
